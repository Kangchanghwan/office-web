name: cs-deploy
# 빌드 → Cloudflare 한도 검사 → 형식별 열기·내려받기 검사 → 배포
#   cs/preview 에 push: 미리보기 (office-editor 프로젝트의 cs-preview 브랜치)
#   cs/main 에 push:    운영 (office.clipboardapp.org)
on:
  push:
    branches: [cs/main, cs/preview]
  workflow_dispatch:

concurrency:
  group: cs-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tools
        run: |
          pip install --quiet fonttools
          npm i --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Build
        run: ./cs/build/build.sh
      - name: Cloudflare Pages limits (files < 20000, each <= 25 MiB)
        run: python3 cs/build/check-limits.py out
      - name: Unit tests (cbEdit core)
        run: node --test cs/test/embed-core.test.cjs
      - name: Gate (open -> download for each format)
        run: |
          python3 server.py --port 8080 --root out > server.log 2>&1 &
          sleep 2
          node cs/gate/smoke.mjs http://127.0.0.1:8080
          node cs/gate/embed.mjs http://127.0.0.1:8080
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-report
          path: |
            cs/gate/report.json
            cs/gate/embed-report.json
            server.log
          if-no-files-found: warn
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=배포 건너뜀::Cloudflare 시크릿이 없어 배포하지 않았습니다."
            exit 0
          fi
          if [ "$GITHUB_REF_NAME" = "cs/main" ]; then BR=main; else BR=cs-preview; fi
          npx --yes wrangler@4 pages deploy out --project-name office-editor --branch "$BR" --commit-hash "$GITHUB_SHA" --commit-message "office-web ${GITHUB_SHA::7}"
